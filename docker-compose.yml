services:
  backend:
    build:
      context: ./backend
    container_name: django-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./my_index:/app/my_index
      - /app/__pycache__
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: mydb
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db
      DB_PORT: 3306
      # Override DB settings for Docker, but allow other vars from .env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-change-this-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: mysql_db
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=mydb
      - MYSQL_USER=myuser
      - MYSQL_PASSWORD=mypassword
    ports:
      - "3307:3306"  # Changed host port to 3307 to avoid conflict with local MySQL
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    depends_on:
      - db
    environment:
      PMA_HOST: db         # Connect to the "db" service
      PMA_USER: myuser     # Same as MYSQL_USER
      PMA_PASSWORD: mypassword  # Same as MYSQL_PASSWORD
    ports:
      - "8080:80"          # Access phpMyAdmin at http://localhost:8080

  frontend:
    build:
      context: ./frontend
    container_name: react-frontend
    ports:
      - "3002:3002"
    volumes:
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      FAST_REFRESH: "true"
      WDS_SOCKET_PORT: "0"
      WDS_SOCKET_HOST: "0.0.0.0"
      HOST: "0.0.0.0"
      REACT_APP_API_URL: "http://localhost:8000"

volumes:
  db_data:
  frontend_node_modules: